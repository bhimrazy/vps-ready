# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `make deny` (or `cargo deny check`).

[graph]
all-features = true

[advisories]
# Vulnerabilities are always errors. Unmaintained crates are reported for any
# crate in the graph; yanked versions are warnings so a yank upstream does not
# break CI before Dependabot catches up.
unmaintained = "all"
yanked = "warn"
ignore = []

[licenses]
# Permissive licenses compatible with Apache-2.0 distribution.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The allow list is a policy, not an inventory: do not warn about unused entries.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
