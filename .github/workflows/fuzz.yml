name: fuzz

# Not part of ci-ok: a short run on a schedule, on demand, and on PRs that
# touch the fuzz targets.
on:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:
  pull_request:
    paths:
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      # cargo-fuzz has no --locked; fetching first fails if fuzz/Cargo.lock is stale.
      - run: cargo +nightly fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo +nightly fuzz build -O
      - name: Run each target for 60s
        run: |
          for target in $(cargo +nightly fuzz list); do
            cargo +nightly fuzz run -O "$target" -- -max_total_time=60 -timeout=10
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
