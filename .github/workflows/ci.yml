name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --features testing

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
        with:
          toolchain: "1.98" # keep in sync with rust-version in Cargo.toml
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `+1.98` overrides rust-toolchain.toml, which pins the latest stable.
      - run: cargo +1.98 check --workspace --locked

  build-musl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
      # Linked with rust-lld and the musl CRT bundled with the Rust target
      # (see .cargo/config.toml); no cross toolchain needed.
      - run: cargo build --release --locked --target "$TARGET"
      - name: Check the binary is static
        run: |
          file "target/$TARGET/release/vps-ready" | tee /dev/stderr \
            | grep -Eq 'statically linked|static-pie linked'
      # The runner is a VM, not a container, so this exercises the kernel
      # checks for real. Exit 1 (a control failed or is unknown) is expected; 2 is an
      # error.
      - name: Run detect and audit on the runner
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          bin="target/$TARGET/release/vps-ready"
          "$bin" detect
          rc=0
          sudo "$bin" audit || rc=$?
          [ "$rc" -le 1 ]
          # Every kernel and network control must have been checked.
          sudo "$bin" audit --json >audit.json || true
          jq -e '[.findings[] | select(.id | test("^(KRN|NET)-"))
                 | select(.status == "skip" or .status == "unknown")] | length == 0' audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vps-ready-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vps-ready
          if-no-files-found: error
          retention-days: 7

  # Layer 2: the real static binary inside systemd containers (see docs/testing.md).
  containers:
    needs: build-musl
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-22.04, base: "ubuntu:22.04" }
          - { distro: ubuntu-24.04, base: "ubuntu:24.04" }
          - { distro: debian-12, base: "debian:12" }
          - { distro: debian-13, base: "debian:13" }
    env:
      DISTRO: ${{ matrix.distro }}
      BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vps-ready-x86_64-unknown-linux-musl
          path: bin
      - run: chmod +x bin/vps-ready
      - name: Build the test image
        run: |
          docker build -f test/images/Containerfile --build-arg BASE="$BASE" \
            -t "vps-ready-test:$DISTRO" test/images
      - name: Run detect and audit in the container
        run: test/container-audit.sh "$DISTRO" bin/vps-ready

  # Single required check for branch protection.
  ci-ok:
    if: always()
    needs: [fmt, clippy, test, doc, deny, msrv, build-musl, containers]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
