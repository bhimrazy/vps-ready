name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Whether a pull request touches anything besides docs; the slow jobs skip
  # docs-only ones. Pushes always run everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          # The PR's merge commit and its first parent, the base.
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            code=true
          elif git diff --name-only HEAD^1 HEAD | tee /dev/stderr \
            | grep -Ev '^(docs/|site/|\.idea/)|\.md$' | grep -q .; then
            code=true
          else
            code=false
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --features testing

  doc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --no-deps --workspace --locked
        env:
          RUSTDOCFLAGS: -D warnings

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: "1.98" # keep in sync with rust-version in Cargo.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `+1.98` overrides rust-toolchain.toml, which pins the latest stable.
      - run: cargo +1.98 check --workspace --locked

  build-musl:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # Linked with rust-lld and the musl CRT bundled with the Rust target
      # (see .cargo/config.toml); no cross toolchain needed.
      - run: cargo build --release --locked --target "$TARGET"
      - name: Check the binary is static
        run: |
          file "target/$TARGET/release/vps-ready" | tee /dev/stderr \
            | grep -Eq 'statically linked|static-pie linked'
      # The runner is a VM, not a container, so this exercises the kernel
      # checks for real. Exit 1 (a control failed or is unknown) is expected; 2 is an
      # error.
      - name: Run detect and audit on the runner
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          bin="target/$TARGET/release/vps-ready"
          "$bin" detect
          rc=0
          sudo "$bin" audit || rc=$?
          [ "$rc" -le 1 ]
          # Every kernel setting control must have been checked (NET-008 reads
          # /etc/wireguard, which the runner lacks).
          sudo "$bin" audit --json >audit.json || true
          jq -e '[.findings[] | select((.id | test("^(KRN|NET)-")) and .id != "NET-008")
                 | select(.status == "skip" or .status == "unknown")] | length == 0' audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vps-ready-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/vps-ready
          if-no-files-found: error
          retention-days: 7

  # The release build and packaging, without uploading or signing. Each
  # binary is built twice, the second time from another checkout path with
  # another cargo home, so the hashes match only if no build-machine path or
  # other host detail reaches it.
  release-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, deb_arch: amd64, suffix: "" }
          # A pre-release version, for the Debian ~ mapping.
          - { target: aarch64-unknown-linux-musl, deb_arch: arm64, suffix: "-rc.1" }
    env:
      # The same pin as release.yml.
      RUSTUP_TOOLCHAIN: 1.100.0
      TARGET: ${{ matrix.target }}
      DEB_ARCH: ${{ matrix.deb_arch }}
      # Fixed build metadata, as the release sets it from the tag.
      SOURCE_DATE_EPOCH: "1795000000"
      VPS_READY_COMMIT: "000000000000"
      VPS_READY_BUILD_DATE: "2026-11-18"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ env.TARGET }}
      - name: Check the toolchain pin matches release.yml
        run: |
          grep -qx "  RUSTUP_TOOLCHAIN: $RUSTUP_TOOLCHAIN" .github/workflows/release.yml
      - run: scripts/install-cargo-auditable.sh
      - name: Build, rebuild elsewhere, compare
        run: |
          scripts/release-build.sh "$TARGET"
          other="$RUNNER_TEMP/rebuild"
          mkdir -p "$other/src"
          git archive HEAD | tar -x -C "$other/src"
          CARGO_HOME="$other/cargo" "$other/src/scripts/release-build.sh" "$TARGET"
          sha256sum "target/$TARGET/release/vps-ready" "$other/src/target/$TARGET/release/vps-ready" \
            | tee /dev/stderr | awk '{print $1}' | uniq | wc -l | grep -qx 1
      - name: Package
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          VERSION="$(cargo pkgid -p vps-ready | sed 's/.*[#@]//')$SUFFIX" \
            scripts/package.sh "$TARGET" "$DEB_ARCH"
          ls -l dist

  # Layer 2: the real static binary inside systemd containers (see docs/testing.md).
  containers:
    needs: [changes, build-musl]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: ubuntu-22.04, base: "ubuntu:22.04" }
          - { distro: ubuntu-24.04, base: "ubuntu:24.04" }
          - { distro: ubuntu-26.04, base: "ubuntu:26.04" }
          - { distro: debian-12, base: "debian:12" }
          - { distro: debian-13, base: "debian:13" }
    env:
      DISTRO: ${{ matrix.distro }}
      BASE: ${{ matrix.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vps-ready-x86_64-unknown-linux-musl
          path: bin
      - run: chmod +x bin/vps-ready
      # The image is cached per base and Containerfile, and rebuilt weekly so
      # it picks up the distro's updates.
      - id: week
        run: echo "stamp=$(date -u +%G-W%V)" >>"$GITHUB_OUTPUT"
      - id: image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image.tar.zst
          key: test-image-${{ matrix.base }}-${{ hashFiles('test/images/Containerfile') }}-${{ steps.week.outputs.stamp }}
      - name: Load or build the test image
        run: |
          if [ -f image.tar.zst ]; then
            zstd -dc image.tar.zst | docker load
          else
            docker build -f test/images/Containerfile --build-arg BASE="$BASE" \
              -t "vps-ready-test:$DISTRO" test/images
            docker save "vps-ready-test:$DISTRO" | zstd -q -T0 -o image.tar.zst
          fi
      # Saved before the tests, so a failing test still caches the image.
      - if: steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image.tar.zst
          key: test-image-${{ matrix.base }}-${{ hashFiles('test/images/Containerfile') }}-${{ steps.week.outputs.stamp }}
      - name: Run detect and audit in the container
        run: test/container-audit.sh "$DISTRO" bin/vps-ready
      - name: Apply and roll back updates.auto in the container
        run: test/container-apply.sh "$DISTRO" bin/vps-ready
      - name: Apply and roll back ssh.bruteforce in the container
        run: test/container-bruteforce.sh "$DISTRO" bin/vps-ready
      - name: Apply and roll back user.admin in the container
        run: test/container-admin.sh "$DISTRO" bin/vps-ready
      - name: Apply and roll back deploy.docker in the container
        run: test/container-docker.sh "$DISTRO" bin/vps-ready
      - name: Apply and roll back deploy.proxy in the container
        run: test/container-proxy.sh "$DISTRO" bin/vps-ready
      - name: Apply and roll back net.tailscale in the container
        run: test/container-tailscale.sh "$DISTRO" bin/vps-ready
      - name: Apply and roll back net.tunnel in the container
        run: test/container-tunnel.sh "$DISTRO" bin/vps-ready
      - name: Install wireguard-tools; net.wireguard needs the kernel module
        run: test/container-wireguard.sh "$DISTRO" bin/vps-ready

  # Single required check for branch protection. build-musl, release-build and
  # containers may be skipped (a docs-only PR); every other result must be success.
  ci-ok:
    if: always()
    needs: [changes, fmt, clippy, test, doc, deny, msrv, build-musl, release-build, containers]
    runs-on: ubuntu-24.04
    steps:
      - name: All jobs passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success"
            or (.value.result == "skipped" and (.key == "build-musl" or .key == "release-build" or .key == "containers")))' >/dev/null
