# Release pipeline: builds static musl binaries, .deb packages and an SBOM,
# publishes them with checksums, a cosign signature, build-provenance and SBOM
# attestations and install.sh, then publishes the vps-ready and vpsready
# crates to crates.io.
#
# Hand-written rather than generated by cargo-dist: two targets do not justify
# a generated workflow, and every line here should be auditable.
#
# Before pushing the first tag, enable in the repository settings:
#   - General > Releases: "Enable release immutability" (immutable releases).
#   - Environments: `release` and `crates-io`, limited to `v*` tags. No
#     required reviewer: pushing the tag is the approval.
#   - Rules: a tag ruleset protecting `v*` from update and deletion, and one
#     that lets only repository admins create `v*` tags.
#
# Verification instructions for users are in SECURITY.md.

name: release

on:
  push:
    tags: ["v*"]

permissions: {}

env:
  # The exact compiler for every release job, so a rebuild can use the same
  # one. At least rust-version in Cargo.toml. RUSTUP_TOOLCHAIN overrides the
  # floating channel in rust-toolchain.toml; ci.yml rebuilds with the same
  # version.
  RUSTUP_TOOLCHAIN: 1.100.0

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            deb_arch: amd64
          - target: aarch64-unknown-linux-musl
            deb_arch: arm64
    env:
      TARGET: ${{ matrix.target }}
      DEB_ARCH: ${{ matrix.deb_arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Set build metadata
        run: |
          epoch=$(git log -1 --format=%ct)
          {
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "SOURCE_DATE_EPOCH=$epoch"
            echo "VPS_READY_COMMIT=$(git rev-parse --short=12 HEAD)"
            echo "VPS_READY_BUILD_DATE=$(date -u -d "@$epoch" +%Y-%m-%d)"
          } >> "$GITHUB_ENV"

      - name: Check the tag matches the crate version
        run: |
          crate=$(cargo pkgid -p vps-ready | sed 's/.*[#@]//')
          [ "$crate" = "$VERSION" ] || { echo "tag v$VERSION != crate $crate"; exit 1; }

      - run: scripts/install-cargo-auditable.sh

      # Linked with rust-lld and the musl CRT bundled with the Rust target
      # (see .cargo/config.toml). Also checks the binary is static and
      # carries its dependency list.
      - run: scripts/release-build.sh "$TARGET"

      # The tarball and the .deb, with the man pages, completions and
      # changelog; checks the .deb's version and contents.
      - run: scripts/package.sh "$TARGET" "$DEB_ARCH"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  # Its own job, with read-only permissions, so that compiling cargo-cyclonedx
  # and its dependencies never runs next to the release credentials.
  sbom:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - run: cargo install --locked --version 0.5.9 cargo-cyclonedx
      # One SBOM for the binary's crate, covering the dependencies of every
      # target, built from Cargo.lock.
      - name: Generate the SBOM
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cargo cyclonedx --manifest-path crates/vps-ready/Cargo.toml \
            --format json --spec-version 1.5 --target all
          mkdir dist
          mv crates/vps-ready/vps-ready.cdx.json "dist/vps-ready-$VERSION.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sbom
          path: dist/*.cdx.json
          if-no-files-found: error

  release:
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless signing (cosign) and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums and install.sh
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd dist
          sha256sum vps-ready-*.tar.gz > checksums.txt
          sed -e "s/__VERSION__/$VERSION/g" \
              -e '/__CHECKSUMS__/{' -e 'r checksums.txt' -e 'd' -e '}' \
              ../scripts/install.sh.tmpl > install.sh
          sh -n install.sh
          if grep -q '__[A-Z]*__' install.sh; then echo 'unsubstituted placeholder'; exit 1; fi
          # The installer embeds only the tarballs' lines above. These files
          # come after it, so that the cosign signature covers them too.
          set -- vps-ready_*.deb
          [ $# = 2 ] && [ -f "$1" ] || { echo 'expected 2 .deb files'; exit 1; }
          sbom="vps-ready-$VERSION.cdx.json"
          [ -f "$sbom" ] || { echo "missing $sbom"; exit 1; }
          sha256sum install.sh vps-ready_*.deb "$sbom" >> checksums.txt
          echo "SBOM=dist/$sbom" >> "$GITHUB_ENV"
          cat checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.cdx.json
            dist/install.sh

      # The SBOM, as a CycloneDX predicate of the tarballs and packages.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
          predicate-type: https://cyclonedx.org/bom
          predicate-path: ${{ env.SBOM }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      # Assets are uploaded to a draft, then published, so the release is
      # complete before it becomes immutable.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags such as v0.1.0-alpha.1 are pre-releases.
          case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $pre \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # crates.io trusted publishing: the auth action trades GitHub's OIDC identity
  # for a short-lived token, so no secret is stored. It cannot create a crate;
  # each crate's first version was published by hand with a short-lived token.
  crates:
    needs: release
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # One crate at a time, in dependency order. A version already on
      # crates.io is skipped, so a rerun or the next tag finishes a partial
      # publish, and a failed publish is retried while the index catches up
      # with the crate it depends on.
      - run: |
          published() {
            curl -fs -o /dev/null -A "vps-ready release (github.com/bhimrazy/vps-ready)" \
              "https://crates.io/api/v1/crates/$1/$2"
          }
          for c in sshd-config vps-ready vpsready; do
            v=$(cargo pkgid -p "$c" | sed 's/.*[@#]//')
            for _ in 1 2 3 4 5; do
              published "$c" "$v" && continue 2
              cargo publish -p "$c" --locked || sleep 60
            done
            published "$c" "$v" && continue
            echo "::error::$c $v was not published"
            exit 1
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
