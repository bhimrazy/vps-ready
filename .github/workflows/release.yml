# Release pipeline: builds static musl binaries, publishes them with
# checksums, a cosign signature, build-provenance attestations and install.sh,
# then publishes the vps-ready and vpsready crates to crates.io.
#
# Hand-written rather than generated by cargo-dist: two targets do not justify
# a generated workflow, and every line here should be auditable.
#
# Before pushing the first tag, enable in the repository settings:
#   - General > Releases: "Enable release immutability" (immutable releases).
#   - Environments: `release` and `crates-io`, limited to `v*` tags. No
#     required reviewer: pushing the tag is the approval.
#   - Rules: a tag ruleset protecting `v*` from update and deletion, and one
#     that lets only repository admins create `v*` tags.
#
# Verification instructions for users are in SECURITY.md.

name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Set build metadata
        run: |
          epoch=$(git log -1 --format=%ct)
          {
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "SOURCE_DATE_EPOCH=$epoch"
            echo "VPS_READY_COMMIT=$(git rev-parse --short=12 HEAD)"
            echo "VPS_READY_BUILD_DATE=$(date -u -d "@$epoch" +%Y-%m-%d)"
          } >> "$GITHUB_ENV"

      - name: Check the tag matches the crate version
        run: |
          crate=$(cargo pkgid -p vps-ready | sed 's/.*[#@]//')
          [ "$crate" = "$VERSION" ] || { echo "tag v$VERSION != crate $crate"; exit 1; }

      # Linked with rust-lld and the musl CRT bundled with the Rust target
      # (see .cargo/config.toml).
      - run: cargo build --release --locked --target "$TARGET"

      - name: Check the binary is static
        run: |
          file "target/$TARGET/release/vps-ready" | tee /dev/stderr \
            | grep -Eq 'statically linked|static-pie linked'

      - name: Package
        run: |
          name="vps-ready-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/vps-ready" LICENSE-APACHE LICENSE-MIT NOTICE README.md "dist/$name/"
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner \
            -C dist -cf - "$name" | gzip -n > "dist/$name.tar.gz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # create the GitHub release
      id-token: write # keyless signing (cosign) and attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Checksums and install.sh
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cd dist
          sha256sum vps-ready-*.tar.gz > checksums.txt
          sed -e "s/__VERSION__/$VERSION/g" \
              -e '/__CHECKSUMS__/{' -e 'r checksums.txt' -e 'd' -e '}' \
              ../scripts/install.sh.tmpl > install.sh
          sh -n install.sh
          if grep -q '__[A-Z]*__' install.sh; then echo 'unsubstituted placeholder'; exit 1; fi
          sha256sum install.sh >> checksums.txt
          cat checksums.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/install.sh

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt

      # Assets are uploaded to a draft, then published, so the release is
      # complete before it becomes immutable.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags such as v0.1.0-alpha.1 are pre-releases.
          case $GITHUB_REF_NAME in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $pre \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes dist/*
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # crates.io trusted publishing: the auth action trades GitHub's OIDC identity
  # for a short-lived token, so no secret is stored. It cannot create a crate;
  # each crate's first version was published by hand (see docs/release.md).
  crates:
    needs: release
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # Publishes vps-ready first, then the vpsready alias that depends on it.
      - run: cargo publish --workspace --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
