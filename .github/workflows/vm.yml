# Layer 3: the real static binary in KVM virtual machines (see docs/testing.md).
name: vm

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - crates/vps-ready/src/engine/**
      - crates/vps-ready/src/resource/**
      - crates/vps-ready/src/modules/**
      - crates/vps-ready/src/sys/**
      - test/vm-*
      - .github/workflows/vm.yml
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master 2026-10-09
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: x86_64-unknown-linux-musl
      - run: cargo build --release --locked --target "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vps-ready-vm
          path: target/x86_64-unknown-linux-musl/release/vps-ready
          if-no-files-found: error
          retention-days: 7

  vm:
    name: vm (${{ matrix.distro }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Pinned official cloud images. Bump the URL and the checksum together,
        # taken from the release's SHA256SUMS (Ubuntu) or SHA512SUMS (Debian).
        include:
          - distro: ubuntu-22.04
            url: https://cloud-images.ubuntu.com/releases/jammy/release-20261020/ubuntu-22.04-server-cloudimg-amd64.img
            sum: sha256:2099e63da0b822ef8e05e3d596c1b402eaaae658fc08ab919cb8495bfcdc488b
          - distro: ubuntu-24.04
            url: https://cloud-images.ubuntu.com/releases/noble/release-20261017/ubuntu-24.04-server-cloudimg-amd64.img
            sum: sha256:04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94
          - distro: debian-12
            url: https://cloud.debian.org/images/cloud/bookworm/20261021-2638/debian-12-genericcloud-amd64-20261021-2638.qcow2
            sum: sha512:9f181877006e8d9ca4f4554eba8729a829936f0f7d1db5e77f69b1ef0f6bc372b4d46f3dae39b10d84f9131496c2cc1d449264f26577fe934a79de5a5512a3dd
          - distro: debian-13
            url: https://cloud.debian.org/images/cloud/trixie/20261021-2638/debian-13-genericcloud-amd64-20261021-2638.qcow2
            sum: sha512:16e0965312c56feb331049d45d2b1b5778f3f942a33d4300eedbb97527707f2bea87c0006f3e4cc7a25fadbff739c4e235a51fb9bcd1b66fd554f7f8e80ba45c
    env:
      DISTRO: ${{ matrix.distro }}
      URL: ${{ matrix.url }}
      SUM: ${{ matrix.sum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Hosted Linux runners have KVM, but only root can open /dev/kvm by
      # default; this is the rule from GitHub's changelog of 2024-04-02.
      - name: Enable KVM
        run: |
          [ -e /dev/kvm ] || { echo "::error::/dev/kvm is missing on this runner"; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
      # Restore and save are separate so that a failing test still caches the image.
      - id: image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image.qcow2
          key: vm-image-${{ matrix.distro }}-${{ matrix.sum }}
      - name: Download and verify the cloud image
        run: |
          [ -f image.qcow2 ] || curl -fsSL --retry 3 -o image.qcow2 "$URL"
          echo "${SUM#*:}  image.qcow2" | "${SUM%%:*}sum" -c
          du -h image.qcow2
      - if: steps.image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image.qcow2
          key: vm-image-${{ matrix.distro }}-${{ matrix.sum }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vps-ready-vm
          path: bin
      - run: chmod +x bin/vps-ready
      - name: Apply, reboot and roll back in the VM
        run: test/vm-cycle.sh "$DISTRO" bin/vps-ready image.qcow2
