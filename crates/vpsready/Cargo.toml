[package]
name = "vpsready"
description = "The vps-ready command under the name `vpsready`. Same code, published from the same repository."
categories = ["command-line-utilities"]
keywords = ["vps", "hardening", "security", "ssh", "linux"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "vpsready"
path = "src/main.rs"

[dependencies]
vps-ready.workspace = true

# cargo-binstall: no release asset carries this binary name, so binstall
# builds it from source; never take third-party prebuilt binaries.
[package.metadata.binstall]
disabled-strategies = ["quick-install"]

[lints]
workspace = true
